# =============================================================================
# GitHub Actions: 手动触发构建 APK
#
# 仓库 -> Actions -> "Build Android APK" -> Run workflow
# 弹窗顶部 GitHub 自带 branch/tag 选择器,选好分支 + 下面的构建参数即可
#
# 前置条件:.gitmodules 里 4 个死链 URL(citra-emu/ext-boost、
#          citra-emu/dynarmic-android、citra-emu/ext-soundtouch、
#          citra-emu/ext-libressl-portable)已经改成你自己的 fork
# =============================================================================

name: Build Android APK

on:
  workflow_dispatch:
    # 分支选择直接用 GitHub UI 顶部自带的"Run workflow from"下拉,这里不再重复
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      ndk_version:
        description: "NDK 版本(留空使用 build.gradle 声明的版本)"
        required: false
        default: ""
        type: string

# -----------------------------------------------------------------------------
# 权限:actions 默认 token 够用,只有要推回仓库时才需要更高权限
# -----------------------------------------------------------------------------
permissions:
  contents: read

# -----------------------------------------------------------------------------
# 一次构建里只跑最新的那一次,避免重复排队
# -----------------------------------------------------------------------------
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ---------------------------------------------------------------
      # 1. 拉取源码 + 所有子模块(.gitmodules 里的 URL 已修正)
      # ---------------------------------------------------------------
      - name: Checkout source (${{ github.ref_name }})
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          lfs: true
          fetch-depth: 1

      # ---------------------------------------------------------------
      # 2. 设置 JDK 17(AGP 8.x 需要)
      # ---------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ---------------------------------------------------------------
      # 3. 配置 Android SDK + NDK
      #    inputs.ndk_version 为空时,沿用 build.gradle 里声明的版本
      # ---------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-sdk-licenses: true
          ndk-version: ${{ inputs.ndk_version || '' }}
          build-tools: "34.0.0"
          packages: |
            platform-tools
            platforms;android-34

      # ---------------------------------------------------------------
      # 4. 给 gradlew 执行权限
      # ---------------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x src/android/gradlew

      # ---------------------------------------------------------------
      # 5. 跑构建
      #    debug   -> assembleDebug
      #    release -> assembleRelease
      # ---------------------------------------------------------------
      - name: Build APK
        working-directory: src/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx2g"
        run: |
          set -eux
          VARIANT="$(tr '[:lower:]' '[:upper:]' <<< '${inputs.build_type}')"
          echo "==> Building assemble${VARIANT} on ref ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::8})"
          echo "    (branch selected from GitHub UI 'Run workflow from' picker)"
          ./gradlew "assemble${VARIANT}" --no-daemon --stacktrace

      # ---------------------------------------------------------------
      # 6. 收集 APK 作为可下载 artifact
      # ---------------------------------------------------------------
      - name: Collect APK artifacts
        if: always()
        run: |
          mkdir -p apk-output
          find src/android/app/build/outputs/apk -name "*.apk" -exec cp -v {} apk-output/ \; 2>/dev/null || true
          echo "---- APK 列表 ----"
          ls -lh apk-output/ || true

      - name: Upload APK
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}-${{ github.ref_name }}-${{ github.sha }}
          path: apk-output/*.apk
          if-no-files-found: warn
          retention-days: 30

      # ---------------------------------------------------------------
      # 7. 构建失败时打包 Gradle 日志方便排查
      # ---------------------------------------------------------------
      - name: Upload Gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-${{ github.run_id }}
          path: |
            src/android/app/build/outputs/logs/
            ~/.gradle/daemon/**/*.log
          if-no-files-found: ignore
          retention-days: 7
